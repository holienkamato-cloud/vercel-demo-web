<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vercel Demo</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: linear-gradient(135deg,#4f46e5,#06b6d4); color: #fff; }
    .card { text-align: center; padding: 2rem 3rem; margin: 16px; background: rgba(0,0,0,.25); border-radius: 16px; }
    h1 { margin: 0 0 .5rem; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ahoj z Vercelu 👋</h1>
    <p>Testovacia stránka nasadená z git repozitára.</p>
    <p id="time"></p>
    <button id="btn">Klikni</button>
  </div>
  <script>
    document.getElementById('time').textContent = 'Načítané: ' + new Date().toLocaleString('sk-SK');
    let n = 0; const b = document.getElementById('btn');
    b.onclick = () => b.textContent = 'Kliknuté ' + (++n) + '×';
  </script>
</body>
</html>
